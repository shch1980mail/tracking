<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — ТПК</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
<form method="post" action="/admin/login" class="bg-white border rounded-lg p-5 w-full max-w-sm space-y-3">
 <h1 class="text-lg font-bold">ТПК — вход</h1>
 {% if error %}<p class="text-red-600 text-sm">{{ error }}</p>{% endif %}
 <input name="login" placeholder="Логин" autocomplete="username" required class="border rounded px-2 py-2 w-full">
 <input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required class="border rounded px-2 py-2 w-full">
 <button class="w-full bg-blue-600 text-white rounded py-2">Войти</button></form></body></html>
